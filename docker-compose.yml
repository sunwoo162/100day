services:
  harufit:
    build: .
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:4000
      API_ORIGIN: http://localhost:4000
    volumes:
      - harufit-data:/app/server/data
    restart: unless-stopped

volumes:
  harufit-data:
