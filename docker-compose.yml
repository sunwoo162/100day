services:
  harufit:
    build: .
    ports:
      - "${HOST_PORT:-4000}:4000"
    env_file:
      - .env
    environment:
      API_PORT: ${API_PORT:-4000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:4000}
      API_ORIGIN: ${API_ORIGIN:-http://localhost:4000}
    volumes:
      - harufit-data:/app/server/data
    restart: unless-stopped

volumes:
  harufit-data:
